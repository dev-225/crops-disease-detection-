<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AgriScout AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">

    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-green-600">AgriScout AI</div>
            <div class="space-x-6 flex items-center">
                <span class="text-gray-700" id="welcomeMessage">Welcome!</span>
                <a href="dashboard.html" class="text-green-600 font-bold">Dashboard</a>
                <a href="about.html" class="text-gray-600 hover:text-green-600">About</a>
                <button id="logoutButton" data-action="logout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium shadow-md transition-all">Logout</button>
            </div>
        </div>
    </nav>

    
    <main class="container mx-auto px-6 py-12">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-8">Farmer Dashboard</h1>

        <div class="grid lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 bg-white p-8 rounded-xl shadow-lg">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">New Crop Analysis</h2>
                <form id="predictionForm">
                    <div class="mb-6">
                        <label for="cropImage" class="block text-sm font-medium text-gray-700 mb-2">Upload Leaf Image</label>
                        <input type="file" id="cropImage" accept="image/*" required class="w-full p-3 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 cursor-pointer" onchange="previewImage(event)">
                    </div>
                    <img id="imagePreview" src="" alt="Image Preview" class="mt-4 max-h-48 w-auto rounded-lg shadow-md mx-auto hidden mb-6">
                    
                    <button type="submit" id="submitButton" class="w-full bg-green-600 hover:bg-green-700 text-white p-4 rounded-lg font-bold text-lg shadow-md transition-all flex items-center justify-center space-x-2">
                        <svg id="submitIcon" class="animate-spin h-5 w-5 hidden" xmlns="http://www.w.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>🧠 Run AI Diagnosis</span>
                    </button>
                    <p id="statusMessage" class="text-center text-red-400 mt-4"></p>
                </form>
            </div>

            <div class="lg:col-span-1 telemetry-panel p-8 rounded-xl shadow-lg text-white">
                <div class="flex items-center space-x-3 mb-6">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-pulse-live absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                    </span>
                    <h2 class="text-2xl font-bold">Live Sensor Feed</h2>
                </div>
                
                <div class="space-y-6">
                    <div class="sensor-card p-4 rounded-lg">
                        <div class="flex justify-between items-center text-sm text-gray-300 mb-1">
                            <span>🌡 Field Temperature</span>
                            <span id="temp-status" class="text-sm font-bold text-green-400">NORMAL</span>
                        </div>
                        <div id="temp-value" class="text-3xl font-bold text-green-400">24.5°C</div>
                    </div>
                    
                    <div class="sensor-card p-4 rounded-lg">
                         <div class="flex justify-between items-center text-sm text-gray-300 mb-1">
                            <span>💧 Air Humidity</span>
                            <span id="humidity-status" class="text-sm font-bold text-green-400">NORMAL</span>
                        </div>
                        <div id="humidity-value" class="text-3xl font-bold text-blue-400">82.1%</div>
                    </div>
                  
                    <div class="sensor-card p-4 rounded-lg">
                        <div class="text-sm text-gray-300 mb-1">🌱 Soil Moisture</div>
                        <div class="w-full bg-gray-700 rounded-full h-4 mt-2">
                            <div id="soil-bar" class="progress-bar-fill bg-yellow-400 h-4 text-xs font-medium text-blue-800 text-center p-0.5 leading-none rounded-full" style="width: 45%"> 45% </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 grid grid-cols-1 lg:grid-cols-2 gap-8 mt-8">
                <div class="bg-white p-6 rounded-xl shadow-lg">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">Temperature (24h)</h3>
                    <div class="h-64"><canvas id="tempChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-lg">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">Humidity (24h)</h3>
                    <div class="h-64"><canvas id="humidityChart"></canvas></div>
                </div>
            </div>

             <div class="lg:col-span-3 bg-white p-6 rounded-xl shadow-lg mt-8">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Live Event Log</h3>
                <div id="resultsLog" class="h-64 overflow-y-auto bg-gray-900 text-gray-300 font-mono text-sm p-4 rounded-md">
                    <p>Initializing sensor array... System online.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
    <script src="dashboard.js"></script>
    <script src="chart.js"></script>

    <script>
        // Set welcome message
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (user && user.name) {
                document.getElementById('welcomeMessage').textContent = `Welcome, ${user.name}!`;
            }
        });
    </script>
</body>
</html>
